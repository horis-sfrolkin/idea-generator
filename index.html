    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .combination {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.2s ease,
                        background 0.6s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .combination:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .combination:active {
            transform: translateY(0) scale(0.98);
        }

        .combination::after {
            content: "👆 Нажми для новой идеи";
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 0.8em;
            color: rgba(0, 0, 0, 0.45);
            letter-spacing: 0.5px;
        }

        .emoji-pair {
            font-size: 8em;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .emoji-pair span {
            display: inline-block;
            animation: sway 3.2s ease-in-out infinite;
            transform-origin: center bottom;
            will-change: transform;
        }

        .emoji-pair span:nth-child(1) {
            animation-delay: -0.8s;
        }

        .emoji-pair span:nth-child(2) {
            animation-delay: -2.4s;
        }

        .word {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            display: inline-block;
            animation: sway 4s ease-in-out infinite;
            animation-delay: -1.2s;
            transform-origin: center bottom;
            will-change: transform;
        }

        @keyframes sway {
            0%, 100% {
                transform: rotate(-2.5deg) translateY(0);
            }
            50% {
                transform: rotate(2.5deg) translateY(-2px);
            }
        }

        .instruction {
            color: #666;
            margin-top: 20px;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .emoji-pair {
                font-size: 3em;
            }

            .word {
                font-size: 1.5em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .emoji-pair span,
            .word {
                animation: none;
            }
        }
    </style>
</head>
